<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="contect.css" />
    <title>Contect form</title>
  </head>
  <body>
    <header>
        <nav>
            <h2><marquee behavior="scroll" direction="right">Fill Out this form to buid connection with us</marquee></h2>
        </nav>
    </header>

    <section class="contect-form">
      <form action="">
        <div class="form-container">
          <div class="form-dashboard">
            <div class="head-info">
              <h2 class="form-head">Get in Touch</h2>
              <p class="mini-head">
                Fill out the form and i'll connect with you asap.
              </p>
            </div>
            <div class="form-details">
              <label for="name">Name</label>
              <input type="text" placeholder="Enter your name.." required />
              <label for="email">Email</label>
              <input type="email" placeholder="Enter your email.." required />
              <label for="phone">Contect No</label>
              <input type="" placeholder="Enter your number.." required />
              <label for="message">Message</label>
              <textarea
                name=""
                id="contect-desc"
                placeholder="Write your message here.."
              ></textarea>
            </div>
            <div class="button">
              <button type="submit">Submit Form</button>
            </div>
          </div>
        </div>
      </form>
    </section>

    <footer>
      <div class="footer-container">
        <h5>&copy; 2026 SurajJaiswar@portfolio | All rights reserved.</h5>
      </div>
    </footer>

    <script src="contect.js"></script>
  </body>
</html>
